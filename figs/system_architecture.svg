<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="720" viewBox="0 0 1400 720" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect x="180" y="60" width="1000" height="580" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4" />
  <text x="190" y="50" font-family="Arial, sans-serif" font-size="18" fill="#111">
    plain_slam_ros2 System Architecture (IEEE 42010 C&amp;C View)
  </text>

  <!-- Sensors (external) -->
  <rect x="20" y="160" width="140" height="50" fill="#f5f7ff" stroke="#3b5bdb" stroke-width="1.5" />
  <text x="90" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">LiDAR Sensor</text>

  <rect x="20" y="240" width="140" height="50" fill="#f5f7ff" stroke="#3b5bdb" stroke-width="1.5" />
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">IMU Sensor</text>

  <!-- LIO Node -->
  <rect x="220" y="140" width="260" height="60" fill="#e8f1ff" stroke="#2f5fe3" stroke-width="1.5" />
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">LIO3DNode (ROS 2)</text>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">LiDAR/IMU subscriptions</text>

  <rect x="220" y="220" width="260" height="160" fill="#ffffff" stroke="#2f5fe3" stroke-width="1.2" />
  <text x="350" y="245" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111">LIO3DInterface</text>
  <text x="240" y="265" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan x="240" dy="0">• IMUPreintegrator</tspan>
    <tspan x="240" dy="14">• GravityDirecEstimator</tspan>
    <tspan x="240" dy="14">• HierarchicalGeometricObserver</tspan>
    <tspan x="240" dy="14">• JointOptimizer</tspan>
    <tspan x="240" dy="14">• NormalMap + KeyframeDetector</tspan>
    <tspan x="240" dy="14">• VoxelGridFilter</tspan>
  </text>

  <!-- SLAM Node -->
  <rect x="520" y="140" width="260" height="60" fill="#e8f1ff" stroke="#2f5fe3" stroke-width="1.5" />
  <text x="650" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">SLAM3DNode (ROS 2)</text>
  <text x="650" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Time-sync pose + cloud</text>

  <rect x="520" y="220" width="260" height="160" fill="#ffffff" stroke="#2f5fe3" stroke-width="1.2" />
  <text x="650" y="245" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111">SLAM3DInterface</text>
  <text x="540" y="265" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan x="540" dy="0">• KeyframeDetector</tspan>
    <tspan x="540" dy="14">• VoxelGridFilter</tspan>
    <tspan x="540" dy="14">• GICP (loop detection)</tspan>
    <tspan x="540" dy="14">• GraphOptimizer</tspan>
    <tspan x="540" dy="14">• Map &amp; Pose Graph</tspan>
  </text>

  <!-- PC2 to PCD Node -->
  <rect x="220" y="420" width="260" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="1.2" />
  <text x="350" y="455" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111">PC2ToPCDNode (Utility)</text>

  <!-- Map storage -->
  <rect x="820" y="240" width="240" height="100" fill="#fff9db" stroke="#f08c00" stroke-width="1.5" />
  <text x="940" y="270" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#111">Map Storage</text>
  <text x="940" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">/tmp/pslam_data</text>
  <text x="940" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">PCD/BIN files</text>

  <!-- Config -->
  <rect x="820" y="380" width="240" height="60" fill="#f1f3f5" stroke="#6c757d" stroke-width="1.2" />
  <text x="940" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">YAML Config</text>
  <text x="940" y="428" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">lio_3d_params / slam_3d_params</text>

  <!-- Outputs (external) -->
  <rect x="1210" y="180" width="170" height="140" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5" />
  <text x="1295" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">ROS 2 Outputs</text>
  <text x="1295" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Pose / Odometry</text>
  <text x="1295" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Point Clouds</text>
  <text x="1295" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Pose Graph</text>
  <text x="1295" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">TF: odom→imu, map→odom</text>
  <text x="1295" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">RViz / Downstream</text>

  <!-- Data flow arrows -->
  <line x1="160" y1="185" x2="220" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="160" y1="265" x2="220" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="480" y1="170" x2="520" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="500" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">/pslam/imu_pose</text>
  <text x="500" y="168" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">/pslam/deskewed_scan_cloud</text>

  <line x1="780" y1="270" x2="820" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="480" y1="450" x2="820" y2="290" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="610" y="420" font-family="Arial, sans-serif" font-size="10" fill="#333">PCD output</text>

  <polyline points="160,205 160,450 220,450" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" />

  <line x1="480" y1="170" x2="1210" y2="220" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="780" y1="170" x2="1210" y2="250" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Config dashed arrows -->
  <line x1="820" y1="400" x2="480" y2="260" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <line x1="820" y1="410" x2="780" y2="260" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- Legend -->
  <rect x="1210" y="360" width="170" height="90" fill="#ffffff" stroke="#adb5bd" stroke-width="1" />
  <text x="1295" y="380" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111">Legend</text>
  <line x1="1225" y1="400" x2="1265" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1325" y="404" font-family="Arial, sans-serif" font-size="10" fill="#333">Data flow</text>
  <line x1="1225" y1="420" x2="1265" y2="420" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="1325" y="424" font-family="Arial, sans-serif" font-size="10" fill="#333">Configuration</text>
</svg>
